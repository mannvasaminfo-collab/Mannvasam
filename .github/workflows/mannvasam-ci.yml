name: MANNVASAM CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/neon-postgres-persistence]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --include=dev
      - name: Check backend JavaScript syntax
        run: |
          node --check backend/server.js
          node --check backend/db.js
          node --check backend/account-auth.js
      - name: Build storefront
        run: npm run build
