<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>எங்க தோட்டம்</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@600&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff6e6;--glass:rgba(16,22,14,.58);--line:rgba(255,246,230,.28);--acc:#ffc46b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#0c1220;overflow:hidden;color:var(--ink);font-family:'Noto Sans Tamil',system-ui,sans-serif}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
body::after{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.38))}
header,nav{z-index:2}
[hidden]{display:none!important}
#homeBtn{position:fixed;right:84px;top:calc(12px + env(safe-area-inset-top,0px));z-index:6;background:rgba(16,22,14,.58);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;text-decoration:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#homeBtn:hover{border-color:var(--acc)}
#intro{position:fixed;inset:0;z-index:5;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 60%,rgba(10,16,10,.3),rgba(6,10,8,.82));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:24px}
#intro h1{font-size:clamp(34px,8vw,64px);margin:0 0 10px}
#intro p{max-width:30ch;margin:0 auto 22px;font-size:17px;line-height:1.6}
#intro button{margin:4px;padding:10px 22px;font-size:16px}
#intro #go{background:var(--acc);color:#2a1a05;border-color:var(--acc);font-weight:600}
#task{position:fixed;z-index:3;left:12px;top:calc(104px + env(safe-area-inset-top,0px));width:min(360px,calc(100vw - 24px));box-sizing:border-box;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
#task p{margin:4px 0 8px;font-size:14px;line-height:1.5}
.dots{display:flex;gap:6px;margin-bottom:8px}.dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}.dots i.d{background:var(--acc)}.dots i.c{background:#fff}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar span{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button:disabled{opacity:.4;cursor:default}
#mini{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);box-sizing:border-box;width:min(400px,calc(100vw - 24px));background:rgba(20,26,18,.93);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
#mini h2{margin:0 0 8px;font:600 22px 'Noto Serif Tamil',serif}
#mini canvas{position:static!important;inset:auto!important;display:block;margin:0 auto 8px;width:100%;height:auto!important;max-width:360px;border-radius:10px;background:linear-gradient(#bfe0f5,#f3ead2)}
#mini .acts{justify-content:center}
#mini input{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.12);color:var(--ink);width:130px}
header{position:fixed;left:16px;top:calc(12px + env(safe-area-inset-top,0px));max-width:min(420px,80vw);text-shadow:0 1px 8px rgba(0,0,0,.6);pointer-events:none}
h1{margin:0;font:600 clamp(26px,5vw,40px)/1.2 'Noto Serif Tamil',serif}
header p{margin:6px 0 0;font-size:13px;opacity:.9}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100vw - 24px));background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px}
#views{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label{display:grid;gap:6px;font-size:14px}
b{color:var(--acc);font-weight:600}
input[type=range]{width:100%;accent-color:var(--acc)}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px}
</style>
</head>
<body>
<header><h1>எங்க தோட்டம்</h1><p>இழுத்துச் சுற்றுங்கள். சக்கரம் அல்லது இரு விரலால் அருகில் செல்லுங்கள்.</p></header>
<nav>
<div id="views"><button data-v="all">முழுக்காட்சி</button><button data-v="house">வீடு</button><button data-v="field">வயல்</button><button data-v="pond">குளம்</button><button id="rainBtn" aria-pressed="false">மழை</button><button id="walkBtn" aria-pressed="false">நடை</button><button id="sndBtn" aria-pressed="false">ஒலி</button><button id="harvBtn" aria-pressed="false">அறுவடை</button></div>
<label>நேரம்: <b id="clk"></b><input id="tm" type="range" min="0" max="24" step="0.05" value="17.6" aria-label="நாளின் நேரம்"></label>
</nav>
<div id='intro'><div><h1>எங்க தோட்டம்</h1><p>விதை முதல் அரிசி மூட்டை வரை, எல்லாவற்றையும் நீங்களே செய்து பாருங்கள்.</p><button id='go'>தொடங்குங்கள்</button><button id='free'>சுற்றிப் பார்க்க</button></div></div>
<a id='homeBtn' href='/'>← முகப்பு</a>
<div id='task' hidden></div>
<div id='mini' hidden><h2 id='mt'></h2><canvas id='mc' width='360' height='240'></canvas><p id='mp'></p><div id='mb' class='acts'></div></div>
<div id="err">இந்த உலாவியில் 3D காட்சி இயங்கவில்லை. வேறு உலாவியில் திறந்து பாருங்கள்.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
if(!window.THREE){document.getElementById('err').style.display='grid';return}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const R=(a,b)=>a+rnd()*(b-a);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<700?1.5:2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const cv=renderer.domElement;
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xbbd4e8,45,210);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,1200);

/* ---------- lights ---------- */
const hemi=new THREE.HemisphereLight(0xaaccff,0x4a5a30,.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1.5);
sun.castShadow=true;sun.shadow.mapSize.set(innerWidth<700?1024:2048,innerWidth<700?1024:2048);
Object.assign(sun.shadow.camera,{left:-50,right:50,top:50,bottom:-50,near:1,far:260});
sun.shadow.bias=-.0006;sun.shadow.normalBias=.05;scene.add(sun);
const lantern=new THREE.PointLight(0xffc27a,0,22,1.6);lantern.position.set(-17,3,-2.6);scene.add(lantern);

/* ---------- sky ---------- */
const sky={uTop:{value:new THREE.Color()},uHor:{value:new THREE.Color()},uSunCol:{value:new THREE.Color()},uSun:{value:new THREE.Vector3(0,1,0)},uNight:{value:0}};
scene.add(new THREE.Mesh(new THREE.SphereGeometry(500,32,16),new THREE.ShaderMaterial({uniforms:sky,side:THREE.BackSide,depthWrite:false,
vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'varying vec3 vP;uniform vec3 uTop,uHor,uSunCol,uSun;uniform float uNight;float hs(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,45.164)))*43758.5453);}void main(){vec3 d=normalize(vP);float h=max(d.y,0.);vec3 c=mix(uHor,uTop,pow(h,.5));float s=max(dot(d,uSun),0.);c+=uSunCol*(pow(s,900.)*6.+pow(s,40.)*.35+pow(s,5.)*.12);float st=step(.9975,hs(floor(d*220.)));c+=vec3(st)*uNight*smoothstep(.05,.3,d.y);if(d.y<0.)c=mix(c,uHor*.6,clamp(-d.y*8.,0.,1.));gl_FragColor=vec4(c,1.);}'})));

/* ---------- ground, hills, clouds ---------- */
const ground=new THREE.Mesh(new THREE.CircleGeometry(230,48).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:0x5f8d3a}));
ground.receiveShadow=true;scene.add(ground);
const hillMat=new THREE.MeshLambertMaterial({color:0x3f6c47});
for(let i=0;i<11;i++){const a=i/11*Math.PI*2+R(-.1,.1),r=R(140,170);
const h=new THREE.Mesh(new THREE.SphereGeometry(1,16,10),hillMat);h.scale.set(R(30,55),R(12,26),R(30,50));h.position.set(Math.cos(a)*r,-3,Math.sin(a)*r);scene.add(h)}
const cloudMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.85,fog:false});
const clouds=[];
for(let i=0;i<8;i++){const g=new THREE.Group();
for(let k=0;k<5;k++){const s=new THREE.Mesh(new THREE.SphereGeometry(1,10,8),cloudMat);s.scale.set(R(7,13),R(3,5),R(5,8));s.position.set(k*8-16+R(-2,2),R(-1,2),R(-3,3));g.add(s)}
g.position.set(R(-200,200),R(55,85),R(-220,100));clouds.push(g);scene.add(g)}

/* ---------- house + veranda ---------- */
const H=new THREE.Group();H.position.set(-17,0,-8);scene.add(H);
const Lm=c=>new THREE.MeshLambertMaterial({color:c});
const winMat=new THREE.MeshStandardMaterial({color:0x2a2a2a,emissive:0xffb860,emissiveIntensity:0,roughness:.4});
const roofMat=Lm(0xa4472c);
function box(w,h,d,x,y,z,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;H.add(m);return m}
box(9.6,.5,7.2,0,.25,0,Lm(0x9a8f7c));
box(9,3.4,6.5,0,2.2,0,Lm(0xf0e4c6));
const roof=new THREE.Mesh(new THREE.ConeGeometry(1,2.4,4).rotateY(Math.PI/4),roofMat);
roof.scale.set(7.4,1,5.7);roof.position.y=5.1;roof.castShadow=true;H.add(roof);
box(9.6,.5,2.8,0,.25,4.65,Lm(0x9a8f7c));
for(let i=0;i<5;i++){const p=new THREE.Mesh(new THREE.CylinderGeometry(.14,.16,3.2,8),Lm(0xd9ccaa));p.position.set(-4.2+i*2.1,2.1,5.7);p.castShadow=true;H.add(p)}
const vr=box(10.4,.2,3.5,0,3.85,4.7,roofMat);vr.rotation.x=.1;
box(2,.25,.8,0,.12,6.5,Lm(0x9a8f7c));
box(1.3,2.5,.1,0,1.75,3.28,Lm(0x5a3a22));
box(1.3,1.2,.1,-3,2.5,3.28,winMat);box(1.3,1.2,.1,3,2.5,3.28,winMat);
const stoneM=Lm(0xb7ad99);
for(let i=0;i<9;i++){const t=i/8,s=new THREE.Mesh(new THREE.CylinderGeometry(.6,.65,.12,8),stoneM);s.position.set(-17+t*13+R(-.2,.2),.06,-1+t*4+R(-.2,.2));s.receiveShadow=true;scene.add(s)}

/* ---------- rice paddy ---------- */
const FX=10,FZ=0,FW=26,FD=22;
const soil=new THREE.Mesh(new THREE.PlaneGeometry(FW,FD).rotateX(-Math.PI/2),Lm(0x4a3a28));soil.position.set(FX,.03,FZ);soil.receiveShadow=true;scene.add(soil);
const bundM=Lm(0x7a5a3a);
[[FW+1.6,.8,0,-FD/2-.4],[FW+1.6,.8,0,FD/2+.4]].forEach(([w,d,x,z])=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,.4,d),bundM);b.position.set(FX+x,.2,FZ+z);b.castShadow=b.receiveShadow=true;scene.add(b)});
[-FW/2-.4,FW/2+.4].forEach(x=>{const b=new THREE.Mesh(new THREE.BoxGeometry(.8,.4,FD),bundM);b.position.set(FX+x,.2,FZ);b.castShadow=b.receiveShadow=true;scene.add(b)});
const uTime={value:0},uGold={value:0},uGrow={value:1};
const riceMat=new THREE.MeshLambertMaterial({color:0xffffff});
riceMat.onBeforeCompile=s=>{s.uniforms.uTime=uTime;s.uniforms.uGold=uGold;s.uniforms.uGrow=uGrow;s.vertexShader='uniform float uGrow;\n'+s.vertexShader;s.fragmentShader='uniform float uGold;\n'+s.fragmentShader.replace('#include <color_fragment>','#include <color_fragment>\ndiffuseColor.rgb=mix(diffuseColor.rgb,vec3(.86,.68,.24)*(.75+.5*diffuseColor.g),uGold);');
s.vertexShader='uniform float uTime;\n'+s.vertexShader.replace('#include <begin_vertex>','vec3 transformed=vec3(position);transformed.y*=uGrow;float ph=uTime*1.7+instanceMatrix[3].x*.5+instanceMatrix[3].z*.35;float sw=(sin(ph)+.5*sin(ph*2.3))*.06*position.y;transformed.x+=sw;transformed.z+=sw*.5;')};
const bladeG=new THREE.ConeGeometry(.035,.8,3).translate(0,.4,0);
const SP=innerWidth<700?.75:.55,nx=Math.floor((FW-1.6)/SP),nz=Math.floor((FD-1.6)/SP);
const rice=new THREE.InstancedMesh(bladeG,riceMat,nx*nz*4);
{const o=new THREE.Object3D(),c=new THREE.Color();let n=0;
for(let i=0;i<nx;i++)for(let j=0;j<nz;j++){const cx=FX-(FW-1.6)/2+i*SP+R(-.12,.12),cz=FZ-(FD-1.6)/2+j*SP+R(-.12,.12);
const gold=sm(.35,.9,.5+.5*Math.sin(i*.21)*Math.cos(j*.17)+R(-.1,.1));
for(let k=0;k<4;k++){o.position.set(cx+R(-.1,.1),.03,cz+R(-.1,.1));o.rotation.set(R(-.25,.25),R(0,6),R(-.25,.25));o.scale.set(1,R(.8,1.25),1);o.updateMatrix();rice.setMatrixAt(n,o.matrix);
c.set(0x4f9a35).lerp(new THREE.Color(0xb7c24a),gold*.6).offsetHSL(0,0,R(-.04,.04));rice.setColorAt(n,c);n++}}}
rice.castShadow=false;scene.add(rice);

/* ---------- water ---------- */
const waterMat=()=>new THREE.MeshPhongMaterial({color:0x4f7f86,specular:0xffffff,shininess:90,transparent:true,opacity:.6});
const pw=new THREE.Mesh(new THREE.PlaneGeometry(FW,FD,40,34).rotateX(-Math.PI/2),waterMat());pw.position.set(FX,.22,FZ);scene.add(pw);
const pm=new THREE.MeshPhongMaterial({color:0x2b7f8f,specular:0xffffff,shininess:120,transparent:true,opacity:.88});
const pond=new THREE.Mesh(new THREE.RingGeometry(0,5.5,40,10).rotateX(-Math.PI/2),pm);pond.position.set(-14,.18,10);scene.add(pond);
const rim=new THREE.Mesh(new THREE.TorusGeometry(5.7,.4,6,36).rotateX(Math.PI/2),Lm(0x8a8478));rim.position.set(-14,.15,10);rim.scale.y=.6;rim.castShadow=rim.receiveShadow=true;scene.add(rim);
for(let i=0;i<9;i++){const a=R(0,6.28),r=R(.5,4.5);const p=new THREE.Mesh(new THREE.CircleGeometry(R(.35,.6),12).rotateX(-Math.PI/2),Lm(0x3e8a3a));p.position.set(-14+Math.cos(a)*r,.25,10+Math.sin(a)*r);scene.add(p);
if(i<3){const f=new THREE.Mesh(new THREE.SphereGeometry(.22,8,6),Lm(0xf29ac0));f.scale.y=.6;f.position.set(p.position.x,.33,p.position.z);scene.add(f)}}
function wave(m,t,amp,f){const p=m.geometry.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);p.setY(i,Math.sin(x*f+t*1.3)*amp+Math.cos(z*f*1.4+t*1.1)*amp)}p.needsUpdate=true;m.geometry.computeVertexNormals()}

/* ---------- palms ---------- */
const trunkMat=Lm(0x8a7156),frondMat=new THREE.MeshLambertMaterial({color:0x3a8a35,side:THREE.DoubleSide}),nutMat=Lm(0x6b8a2a);
function frondGeo(L){const N=10,pos=[],idx=[];
for(let k=0;k<=N;k++){const t=k/N,x=t*L,y=L*(.45*t-.8*t*t),w=.55*Math.sin(Math.PI*Math.min(1,t*.92+.06));pos.push(x,y,-w,x,y,w);if(k<N){const a=k*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();return g}
const fgeo=[frondGeo(4),frondGeo(4.6),frondGeo(3.5)];
const nutG=new THREE.SphereGeometry(.22,8,6);
const palms=[];
function palm(x,z,h){const g=new THREE.Group(),bx=R(-1.6,1.6),bz=R(-1.6,1.6);
const V=(a,b,c)=>new THREE.Vector3(a,b,c);
const curve=new THREE.CatmullRomCurve3([V(0,0,0),V(bx*.2,h*.35,bz*.2),V(bx*.6,h*.7,bz*.6),V(bx,h,bz)]);
const tr=new THREE.Mesh(new THREE.TubeGeometry(curve,12,.24,7),trunkMat);tr.castShadow=true;g.add(tr);
const top=new THREE.Group();top.position.set(bx,h,bz);g.add(top);
for(let i=0;i<12;i++){const f=new THREE.Mesh(fgeo[i%3],frondMat);f.rotation.order='YZX';f.rotation.y=i/12*6.283+R(-.2,.2);f.rotation.z=R(.05,.55);f.castShadow=true;top.add(f)}
for(let i=0;i<4;i++){const n=new THREE.Mesh(nutG,nutMat);n.position.set(R(-.3,.3),-.25,R(-.3,.3));top.add(n)}
g.position.set(x,0,z);g.userData.ph=R(0,6);scene.add(g);palms.push(g)}
[[-6,14],[-2,17],[-23,11],[-26,0],[-25,-14],[-10,-17],[2,-17],[16,-17],[30,-14],[33,2],[30,14],[18,18],[6,19],[-10,-25]].forEach(([x,z])=>palm(x,z,R(9,13)));

/* ---------- fireflies ---------- */
const FN=80,fp=new Float32Array(FN*3),fb=[];
for(let i=0;i<FN;i++){const x=R(-20,26),y=R(.8,3.5),z=R(-12,14);fb.push([x,y,z,R(0,6)]);fp.set([x,y,z],i*3)}
const fg=new THREE.BufferGeometry();fg.setAttribute('position',new THREE.BufferAttribute(fp,3));
const fm=new THREE.PointsMaterial({color:0xffe27a,size:.35,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
scene.add(new THREE.Points(fg,fm));

/* ---------- life: cow, cart, scarecrow, birds, rain ---------- */
let sunBase=1.5;
const wood=Lm(0x8a5a2e);
function part(g,geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;g.add(m);return m}
const cow=new THREE.Group(),cw=Lm(0xf2eadb),cb=Lm(0x6b4a2e);
part(cow,new THREE.BoxGeometry(.8,.8,1.7),cw,0,1.1,0);
part(cow,new THREE.BoxGeometry(.82,.4,.6),cb,0,1.3,.2);
part(cow,new THREE.BoxGeometry(.5,.18,.5),cb,0,.7,-.4);
const chead=new THREE.Group();chead.position.set(0,1.5,.95);cow.add(chead);
part(chead,new THREE.BoxGeometry(.5,.5,.6),cw,0,0,.15);
part(chead,new THREE.ConeGeometry(.05,.3,6),Lm(0xe9dcc0),-.22,.32,.1).rotation.z=.5;
part(chead,new THREE.ConeGeometry(.05,.3,6),Lm(0xe9dcc0),.22,.32,.1).rotation.z=-.5;
[[-.28,.7],[.28,.7],[-.28,-.7],[.28,-.7]].forEach(([x,z])=>part(cow,new THREE.BoxGeometry(.14,.7,.14),cw,x,.35,z));
part(cow,new THREE.BoxGeometry(.06,.8,.06),cb,0,1.0,-.9);
scene.add(cow);
const cart=new THREE.Group();cart.position.set(-8,0,-6);cart.rotation.y=.4;
part(cart,new THREE.BoxGeometry(2.2,.2,3.2),wood,0,1,0);
[-1.1,1.1].forEach(x=>part(cart,new THREE.BoxGeometry(.1,.5,3.2),wood,x,1.35,0));
[-1.6,1.6].forEach(z=>part(cart,new THREE.BoxGeometry(2.2,.5,.1),wood,0,1.35,z));

/* ---------- camera ---------- */
const views={all:{t:[2,1,0],r:58,az:.7,pol:1.15},house:{t:[-17,2.2,-5],r:20,az:.55,pol:1.3},field:{t:[10,.5,0],r:24,az:.2,pol:1.2},pond:{t:[-14,.5,10],r:14,az:-.7,pol:1.2}};
const goal={t:new THREE.Vector3(),r:58,az:.7,pol:1.15},cur={t:new THREE.Vector3(2,1,0),r:70,az:.4,pol:1.0};
function go(k){const v=views[k];goal.t.set(...v.t);goal.r=v.r;goal.az=v.az;goal.pol=v.pol;idle=0}
let idle=0;go('all');
document.getElementById('views').addEventListener('click',e=>{const k=e.target.dataset.v;if(k)go(k)});
const ptrs=new Map();let lastPinch=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);idle=0});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
const dx=e.clientX-p[0],dy=e.clientY-p[1];ptrs.set(e.pointerId,[e.clientX,e.clientY]);idle=0;
if(ptrs.size===1){goal.az-=dx*.006;goal.pol=clamp(goal.pol-dy*.005,.3,1.48)}
else if(ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(lastPinch)goal.r=clamp(goal.r*lastPinch/d,6,95);lastPinch=d}});
const up=e=>{ptrs.delete(e.pointerId);lastPinch=0};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();goal.r=clamp(goal.r*(1+e.deltaY*.001),6,95);idle=0},{passive:false});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- loop ---------- */
const clock=new THREE.Clock();let T=0;
function frame(){requestAnimationFrame(frame);
const dt=Math.min(clock.getDelta(),.05);T+=dt;uTime.value=T;idle+=dt;
if(idle>6&&!still)goal.az+=dt*.02;
const k=1-Math.exp(-dt*3);
cur.t.lerp(goal.t,k);cur.r+=(goal.r-cur.r)*k;cur.az+=(goal.az-cur.az)*k;cur.pol+=(goal.pol-cur.pol)*k;
cam.position.set(cur.t.x+cur.r*Math.sin(cur.pol)*Math.sin(cur.az),cur.t.y+cur.r*Math.cos(cur.pol),cur.t.z+cur.r*Math.sin(cur.pol)*Math.cos(cur.az));
if(wk.on){walkStep(dt);const ey=1.7+wk.gy,cp=Math.cos(wk.pitch);cam.position.set(wk.x,ey,wk.z);cam.lookAt(wk.x+Math.sin(wk.yaw)*cp,ey+Math.sin(wk.pitch),wk.z+Math.cos(wk.yaw)*cp)}else cam.lookAt(cur.t);
if((window._w=((window._w||0)+1)%2)===0){wave(pw,T,.025+.03*rainAmt,.9+rainAmt);wave(pond,T,.04+.04*rainAmt,1.4+rainAmt)}
palms.forEach(p=>{p.rotation.z=Math.sin(T*.6+p.userData.ph)*.012;p.rotation.x=Math.cos(T*.5+p.userData.ph)*.01});
clouds.forEach(c=>{c.position.x+=dt*1.2;if(c.position.x>260)c.position.x=-260});
if(night>.02){const a=fg.attributes.position;for(let i=0;i<FN;i++){const b=fb[i];a.setXYZ(i,b[0]+Math.sin(T*.5+b[3])*1.2,b[1]+Math.sin(T*.9+b[3]*2)*.4,b[2]+Math.cos(T*.4+b[3])*1.2)}a.needsUpdate=true}
rainAmt+=(rainOn-rainAmt)*Math.min(1,dt*1.5);
sun.intensity=sunBase*(1-.6*rainAmt);scene.fog.near=45-25*rainAmt;scene.fog.far=210-110*rainAmt;
if(rainAmt>.01){const a=rg.attributes.position.array;for(let i=0;i<RN;i++){let y=a[i*6+1]-rv[i]*dt;if(y<0)y+=45;a[i*6+1]=y;a[i*6+4]=y-.9}rg.attributes.position.needsUpdate=true;rain.position.set(cur.t.x,0,cur.t.z);rm.opacity=.55*rainAmt}
rain.visible=rainAmt>.01;
const ca=T*.08;cow.position.set(2+Math.cos(ca)*2,0,15+Math.sin(ca)*2);cow.rotation.y=Math.atan2(-Math.sin(ca),Math.cos(ca));chead.rotation.x=Math.max(0,Math.sin(T*.7))*.6;
scare.rotation.z=Math.sin(T*1.2)*.04;
birds.forEach(b=>{const u=b.userData;u.a+=dt*u.sp;b.position.set(Math.cos(u.a)*u.rad,u.y+Math.sin(T*.4+u.ph)*2,Math.sin(u.a)*u.rad);b.rotation.y=Math.atan2(-Math.sin(u.a),Math.cos(u.a));const s=Math.sin(T*7+u.ph)*.55;u.l.rotation.z=s;u.r.rotation.z=-s;b.visible=night<.7&&rainAmt<.5});
bf.forEach(g=>{const u=g.userData;g.position.set(u.x+Math.sin(T*u.s+u.ph)*4+Math.sin(T*.9)*.5,1.8+Math.sin(T*.7+u.ph)*.6,u.z+Math.cos(T*u.s*1.3+u.ph)*4);const s=Math.sin(T*18+u.ph)*.9;u.l.rotation.z=s;u.r.rotation.z=-s;g.visible=night<.4&&rainAmt<.3});
kolM.color.set(0xf4eee0).multiplyScalar(.3+.7*(1-night));
uGold.value+=(goldT-uGold.value)*Math.min(1,dt*1.2);wl.intensity=sl.intensity=night*1.4;bulbM.color.set(0xffd08a).multiplyScalar(.3+.7*night);
try{jrUpdate(dt);jx(dt)}catch(err){console.error('journey error',err);if(!window._jerr){window._jerr=1;window.dispatchEvent(new ErrorEvent('error',{message:String(err&&err.message||err),lineno:0}))}}sndUpdate();renderer.render(scene,cam)}
frame();
})();
</script>
</body>
</html>
